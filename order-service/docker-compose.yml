version: '4'
# Specifies the version of the Docker Compose file format.

services:
# Defines the services that make up the application.
  mysql:
  # Defines the MySQL service.
    image: mysql:8.1.0
    # Specifies the Docker image to use for the MySQL service.
    container_name: order-service-mysql
    # Sets the name of the container for the MySQL service.
    ports:
    # Exposes ports from the container to the host.
      - "3306:3306"
      # Maps port 3306 on the host to port 3306 on the container.
    environment:
    # Sets environment variables for the MySQL service.
      MYSQL_ROOT_PASSWORD: password
      # Sets the root password for the MySQL database.
    volumes:
    # Defines volumes to persist data.
      - ./mysql:/var/lib/mysql
      # Mounts the `./mysql` directory on the host to `/var/lib/mysql` in the container.
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Mounts the `./docker/mysql/init.sql` file on the host to `/docker-entrypoint-initdb.d/init.sql` in the container, which will be executed on startup.
  zookeeper:
  # Defines the Zookeeper service.
    image: confluentinc/cp-zookeeper:7.5.0
    # Specifies the Docker image to use for the Zookeeper service.
    hostname: zookeeper
    # Sets the hostname of the container.
    container_name: zookeeper
    # Sets the name of the container for the Zookeeper service.
    ports:
    # Exposes ports from the container to the host.
      - "2181:2181"
      # Maps port 2181 on the host to port 2181 on the container.
    environment:
    # Sets environment variables for the Zookeeper service.
      ZOOKEEPER_CLIENT_PORT: 2181
      # Sets the client port for Zookeeper.
      ZOOKEEPER_TICK_TIME: 2000
      # Sets the tick time for Zookeeper.

  broker:
  # Defines the Kafka broker service.
    image: confluentinc/cp-kafka:7.5.0
    # Specifies the Docker image to use for the Kafka broker service.
    container_name: broker
    # Sets the name of the container for the Kafka broker service.
    ports:
    # Exposes ports from the container to the host.
      - "9092:9092"
      # Maps port 9092 on the host to port 9092 on the container.
      - "29092:29092"
      # Maps port 29092 on the host to port 29092 on the container.
    depends_on:
    # Defines dependencies on other services.
      - zookeeper
      # Specifies that the Kafka broker service depends on the Zookeeper service.
    environment:
    # Sets environment variables for the Kafka broker service.
      KAFKA_BROKER_ID: 1
      # Sets the broker ID for the Kafka broker.
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # Sets the Zookeeper connection string for the Kafka broker.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Configures the security protocol mapping for the listeners.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      # Sets the advertised listeners for the Kafka broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Sets the replication factor for the Kafka offsets topic.

  schema-registry:
  # Defines the Schema Registry service.
    image: confluentinc/cp-schema-registry:7.5.0
    # Specifies the Docker image to use for the Schema Registry service.
    hostname: schema-registry
    # Sets the hostname of the container.
    container_name: schema-registry
    # Sets the name of the container for the Schema Registry service.
    depends_on:
    # Defines dependencies on other services.
      - broker
      # Specifies that the Schema Registry service depends on the Kafka broker service.
    ports:
    # Exposes ports from the container to the host.
      - "8085:8081"
      # Maps port 8085 on the host to port 8081 on the container.
    environment:
    # Sets environment variables for the Schema Registry service.
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Sets the host name for the Schema Registry.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      # Sets the Kafka bootstrap servers for the Schema Registry.
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      # Sets the listeners for the Schema Registry.
  kafka-ui:
  # Defines the Kafka UI service.
    container_name: kafka-ui
    # Sets the name of the container for the Kafka UI service.
    image: provectuslabs/kafka-ui:latest
    # Specifies the Docker image to use for the Kafka UI service.
    ports:
    # Exposes ports from the container to the host.
      - "8086:8080"
      # Maps port 8086 on the host to port 8080 on the container.
    depends_on:
    # Defines dependencies on other services.
      - broker
      # Specifies that the Kafka UI service depends on the Kafka broker service.
      #- schema-registry
      # Specifies that the Kafka UI service depends on the Schema Registry service.
    environment:
    # Sets environment variables for the Kafka UI service.
      KAFKA_CLUSTERS_NAME: local
      # Sets the cluster name for the Kafka UI.
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: broker:29092
      # Sets the Kafka bootstrap servers for the Kafka UI.
      # KAFKA_CLUSTERS_SCHEMAREGISTRY: http://schema-registry:8081
      # Sets the Schema Registry URL for the Kafka UI.
      DYNAMIC_CONFIG_ENABLED: 'true'
      # Enables dynamic configuration for the Kafka UI.
