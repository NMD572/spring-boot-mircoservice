name: product-service CI/CD

on:
  push:
    branches: [ feature/cicd ]
    paths:
      - 'product-service/**'
  pull_request:
    branches: [ feature/cicd ]
    paths:
      - 'product-service/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/product-service

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/cicd' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy to VPS
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/cicd' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/product-service:latest

            docker stop product-service || true
            docker rm product-service || true

            docker run -d \
              --name product-service \
              --network microservice-net \
              -p 9080:9080 \
              -e database.connection.url="${{ secrets.MONGO_URI }}" \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/product-service:latest